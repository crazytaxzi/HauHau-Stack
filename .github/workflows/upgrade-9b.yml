      - name: Parse and validate source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($script in @('install.ps1', 'hauhau-voice-stack.ps1', 'config.example.ps1', 'uninstall.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script),
              [ref] $tokens,
              [ref] $parseErrors
            ) | Out-Null
            if (@($parseErrors).Count -gt 0) {
              $details = @($parseErrors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell parser rejected ${script}: $details"
            }
          }

          python -m py_compile voice_proxy.py
          if ($LASTEXITCODE -ne 0) { throw 'voice_proxy.py failed Python compilation.' }

          $installer = Get-Content -LiteralPath install.ps1 -Raw
          foreach ($required in @(
            'Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf',
            '2ca636d9e81d3d23ca9b60c234fe185d30ec082eeba69ce770fdb0c76559a4f5',
            "`$LlamaCppReleaseTag = 'b10280'",
            'Invoke-VerifiedGgufDownload',
            'Test-CompatibleLlamaServer'
          )) {
            if (-not $installer.Contains($required)) { throw "Missing required 9B installer element: $required" }
          }

          $version = Get-Content -LiteralPath VERSION.txt -Raw
          if ($version -notmatch 'Installer version:\s*3\.1\.0') { throw 'VERSION.txt is not 3.1.0.' }

      - name: Commit and push verified source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf __pycache__
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Switch default LLM to HauHauCS Qwen3.5 9B'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and verify v3.1.0 package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          export RELEASE_COMMIT='${{ steps.commit.outputs.sha }}'
          python - <<'PYCODE'
          import hashlib
          import pathlib
          import subprocess
          import zipfile

          files = [
              'README.md',
              'install.ps1',
              'REPAIR_HAUHAU.cmd',
              'INSTALL_CUDA.cmd',
              'voice_proxy.py',
              'uninstall.ps1',
              'INSTALL_DEFER_TTS.cmd',
              'hauhau-voice-stack.ps1',
              'hauhau-voice-stack.cmd',
              'config.example.ps1',
              'CHECK_HAUHAU.cmd',
              'INSTALL.cmd',
              'STOP_HAUHAU.cmd',
              'START_HAUHAU.cmd',
              'VERSION.txt',
          ]
          commit = __import__('os').environ['RELEASE_COMMIT']
          zip_name = 'hauhau_voice_stack_windows_installer_v3.1.0.zip'
          checksum_name = zip_name + '.sha256'
          blobs = {name: subprocess.check_output(['git', 'show', f'{commit}:{name}']) for name in files}

          with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for name in files:
                  zf.writestr(name, blobs[name])

          with zipfile.ZipFile(zip_name, 'r') as zf:
              if zf.namelist() != files:
                  raise SystemExit(f'archive member mismatch: {zf.namelist()!r}')
              bad = zf.testzip()
              if bad is not None:
                  raise SystemExit(f'archive CRC failed: {bad}')
              for name in files:
                  if zf.read(name) != blobs[name]:
                      raise SystemExit(f'archive differs from commit for {name}')

          digest = hashlib.sha256(pathlib.Path(zip_name).read_bytes()).hexdigest()
          pathlib.Path(checksum_name).write_text(f'{digest}  {zip_name}\n', encoding='ascii', newline='\n')
          print(digest)
          PYCODE
          sha256sum --check hauhau_voice_stack_windows_installer_v3.1.0.zip.sha256
          echo "zip=hauhau_voice_stack_windows_installer_v3.1.0.zip" >> "$GITHUB_OUTPUT"
          echo "checksum=hauhau_voice_stack_windows_installer_v3.1.0.zip.sha256" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 hauhau_voice_stack_windows_installer_v3.1.0.zip.sha256)" >> "$GITHUB_OUTPUT"

      - name: Publish v3.1.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v3.1.0 already exists.' >&2
            exit 1
          fi
          cat > /tmp/release-notes.md <<'EOFNOTES'
          # HauHau Stack v3.1.0

          The default LLM is now **HauHauCS Qwen3.5 9B Q4_K_M**.

          - Downloads or reuses `Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf`
          - Verifies the official SHA-256 before use
          - Resumes interrupted `curl.exe` downloads
          - Replaces stale 27B stack configuration with the verified 9B model
          - Requires llama.cpp `b10280` or newer and rejects the existing older `b10250` runtime
          - Leaves an external 27B GGUF file untouched because another application may still use it
          - Keeps explicit custom `-ModelPath` and `-LlmCommandLine` overrides

          The managed 9B model is stored under `%LOCALAPPDATA%\HauHauVoiceStack\models\llm` when it must be downloaded.
          EOFNOTES
          gh release create v3.1.0 \
            '${{ steps.package.outputs.zip }}' \
            '${{ steps.package.outputs.checksum }}' \
            --repo "$GITHUB_REPOSITORY" \
            --target '${{ steps.commit.outputs.sha }}' \
            --title 'HauHau Stack v3.1.0' \
            --notes-file /tmp/release-notes.md \
            --latest

      - name: Verify published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-verify
          gh release download v3.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '${{ steps.package.outputs.zip }}' \
            --pattern '${{ steps.package.outputs.checksum }}' \
            --dir /tmp/release-verify
          cd /tmp/release-verify
          sha256sum --check '${{ steps.package.outputs.checksum }}'
          test "$(sha256sum '${{ steps.package.outputs.zip }}' | cut -d' ' -f1)" = '${{ steps.package.outputs.sha256 }}'
          gh release view v3.1.0 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets,url

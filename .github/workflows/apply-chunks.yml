name: Apply verified HauHauCS 9B chunks

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-chunks.yml

permissions:
  contents: write

concurrency:
  group: hauhau-verified-9b-chunks
  cancel-in-progress: false

jobs:
  verify-commit-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify chunks and extract source
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/chunks.sha256 <<'EOF'
          a7717fbf5a701ff13c64dd30c3a2344e81d1072d9d49d868a0793629ba35530a  .stage9b/chunks/part00
          071d38f0c328c7b84ef08929540d763bfa6653a2b458ebd02a60786a276e9f72  .stage9b/chunks/part01
          db695459eb8858a2afa8c01f703f814f090f6c5f8b0c4c5bd2fdda02d5bd9d1d  .stage9b/chunks/part02
          8b1f0286079519df65ff612afeae06e1d414fdb1b2cc6e312d8881b7593ea8e2  .stage9b/chunks/part03
          41b96cfcbb3cd1605a94f59b41e432f0f3bcdd8ebbfb55952163a01338d31ad8  .stage9b/chunks/part04
          39a4a2001c446469bd69a6a288c4e26ee3f0a03c178dcccb65851ae253d85e8e  .stage9b/chunks/part05
          e3555a899451bd83982b697c447a2a55c3614510ea803507f11853cb8d1b4fd3  .stage9b/chunks/part06
          f4f3960f522a64170e4c250b1e3de71a8d71f07f901671d176c02a1612961ebd  .stage9b/chunks/part07
          e1004cc51cff9b2c5ec7047bf4f8a9adfc28433c9c0e24d1a5ad6c3ee5c9c475  .stage9b/chunks/part08
          EOF
          sed -i 's/^          //' /tmp/chunks.sha256
          sha256sum --check /tmp/chunks.sha256

          cat .stage9b/chunks/part* > /tmp/hauhau-v3.1.0.tar.gz.b64
          base64 --decode /tmp/hauhau-v3.1.0.tar.gz.b64 > /tmp/hauhau-v3.1.0.tar.gz
          echo '9889635e82f35fdbe03b0424beaf6eaa9d5d9357be7d80ff2071dd609f0cb2a7  /tmp/hauhau-v3.1.0.tar.gz' | sha256sum --check

          mapfile -t members < <(tar -tzf /tmp/hauhau-v3.1.0.tar.gz)
          expected=(README.md VERSION.txt config.example.ps1 install.ps1 hauhau-voice-stack.ps1)
          if [[ "${members[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected payload members:\n%s\n' "${members[*]}" >&2
            exit 1
          fi
          tar -xzf /tmp/hauhau-v3.1.0.tar.gz

      - name: Parse and validate upgraded source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          foreach ($script in @('install.ps1', 'hauhau-voice-stack.ps1', 'config.example.ps1', 'uninstall.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $script),
              [ref] $tokens,
              [ref] $parseErrors
            ) | Out-Null
            if (@($parseErrors).Count -gt 0) {
              $details = @($parseErrors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell parser rejected ${script}: $details"
            }
          }

          python -m py_compile voice_proxy.py
          if ($LASTEXITCODE -ne 0) { throw 'voice_proxy.py failed Python compilation.' }

          $installer = Get-Content -LiteralPath install.ps1 -Raw
          foreach ($required in @(
            'Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf',
            '2ca636d9e81d3d23ca9b60c234fe185d30ec082eeba69ce770fdb0c76559a4f5',
            "`$LlamaCppReleaseTag = 'b10280'",
            'Invoke-VerifiedGgufDownload',
            'Test-CompatibleLlamaServer'
          )) {
            if (-not $installer.Contains($required)) {
              throw "Missing required 9B installer element: $required"
            }
          }

          if ((Get-Content -LiteralPath VERSION.txt -Raw) -notmatch 'Installer version:\s*3\.1\.0') {
            throw 'VERSION.txt is not version 3.1.0.'
          }

      - name: Commit and push verified source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf __pycache__
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md VERSION.txt config.example.ps1 install.ps1 hauhau-voice-stack.ps1
          git diff --cached --check
          git commit -m 'Switch default LLM to HauHauCS Qwen3.5 9B'
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and verify v3.1.0 installer
        id: package
        shell: bash
        env:
          RELEASE_COMMIT: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          import pathlib
          import subprocess
          import zipfile

          files = [
              'README.md', 'install.ps1', 'REPAIR_HAUHAU.cmd', 'INSTALL_CUDA.cmd',
              'voice_proxy.py', 'uninstall.ps1', 'INSTALL_DEFER_TTS.cmd',
              'hauhau-voice-stack.ps1', 'hauhau-voice-stack.cmd', 'config.example.ps1',
              'CHECK_HAUHAU.cmd', 'INSTALL.cmd', 'STOP_HAUHAU.cmd',
              'START_HAUHAU.cmd', 'VERSION.txt',
          ]
          commit = os.environ['RELEASE_COMMIT']
          zip_name = 'hauhau_voice_stack_windows_installer_v3.1.0.zip'
          checksum_name = zip_name + '.sha256'
          blobs = {name: subprocess.check_output(['git', 'show', f'{commit}:{name}']) for name in files}

          with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in files:
                  archive.writestr(name, blobs[name])

          with zipfile.ZipFile(zip_name, 'r') as archive:
              if archive.namelist() != files:
                  raise SystemExit(f'archive member mismatch: {archive.namelist()!r}')
              bad = archive.testzip()
              if bad is not None:
                  raise SystemExit(f'archive CRC failed: {bad}')
              for name in files:
                  if archive.read(name) != blobs[name]:
                      raise SystemExit(f'archive differs from commit for {name}')

          digest = hashlib.sha256(pathlib.Path(zip_name).read_bytes()).hexdigest()
          pathlib.Path(checksum_name).write_text(
              f'{digest}  {zip_name}\n', encoding='ascii', newline='\n'
          )
          print(f'SHA256={digest}')
          PY

          sha256sum --check hauhau_voice_stack_windows_installer_v3.1.0.zip.sha256
          echo 'zip=hauhau_voice_stack_windows_installer_v3.1.0.zip' >> "$GITHUB_OUTPUT"
          echo 'checksum=hauhau_voice_stack_windows_installer_v3.1.0.zip.sha256' >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 hauhau_voice_stack_windows_installer_v3.1.0.zip.sha256)" >> "$GITHUB_OUTPUT"

      - name: Publish v3.1.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release v3.1.0 already exists.' >&2
            exit 1
          fi

          cat > /tmp/release-notes.md <<'EOF'
          # HauHau Stack v3.1.0

          The default LLM is now **HauHauCS Qwen3.5 9B Q4_K_M**.

          - Downloads or reuses `Qwen3.5-9B-Uncensored-HauhauCS-Aggressive-Q4_K_M.gguf`
          - Verifies SHA-256 before use
          - Resumes interrupted `curl.exe` downloads
          - Replaces stale 27B stack configuration with the verified 9B model
          - Requires llama.cpp `b10280` or newer
          - Leaves an external 27B GGUF untouched
          - Retains explicit custom `-ModelPath` and `-LlmCommandLine` overrides
          EOF

          gh release create v3.1.0 \
            '${{ steps.package.outputs.zip }}' \
            '${{ steps.package.outputs.checksum }}' \
            --repo "$GITHUB_REPOSITORY" \
            --target '${{ steps.commit.outputs.sha }}' \
            --title 'HauHau Stack v3.1.0' \
            --notes-file /tmp/release-notes.md \
            --latest

      - name: Verify published release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/release-verify
          gh release download v3.1.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern '${{ steps.package.outputs.zip }}' \
            --pattern '${{ steps.package.outputs.checksum }}' \
            --dir /tmp/release-verify
          cd /tmp/release-verify
          sha256sum --check '${{ steps.package.outputs.checksum }}'
          test "$(sha256sum '${{ steps.package.outputs.zip }}' | cut -d' ' -f1)" = '${{ steps.package.outputs.sha256 }}'
          gh release view v3.1.0 --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease,assets,url
